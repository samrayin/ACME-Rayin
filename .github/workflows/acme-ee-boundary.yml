name: ACME Enterprise boundary

# CHG-2026-058. CAIRO holds no Langfuse Enterprise licence, and under the EE
# licence any change to Enterprise-licensed files belongs to Langfuse and may
# only be used with a licence. So ACME never edits them: ACME-only behaviour
# is handled on the MIT side (see web/src/features/rbac/lib/upstreamRole.ts).
#
# This check fails any PR that changes a file under an Enterprise-licensed
# directory. The only exception is an upstream Langfuse version sync, marked
# with the "upstream-sync" label, where those files must come unmodified from
# the upstream release being merged.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  ee-boundary:
    name: No ACME edits to Enterprise-licensed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse changes under ee/ directories
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UPSTREAM_SYNC: ${{ contains(github.event.pull_request.labels.*.name, 'upstream-sync') }}
        run: |
          set -euo pipefail
          touched=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" \
            | grep -E '^(ee/|web/src/ee/|worker/src/ee/|packages/shared/src/server/ee/)' || true)
          if [ -z "$touched" ]; then
            echo "No Enterprise-licensed files changed."
            exit 0
          fi
          if [ "$UPSTREAM_SYNC" = "true" ]; then
            echo "::warning::Enterprise-licensed files changed in an upstream sync. They must be byte-identical to the upstream release being merged; the reviewer confirms this."
            printf 'Files:\n%s\n' "$touched"
            exit 0
          fi
          echo "::error::This PR changes Enterprise-licensed files. ACME must not edit them (EE licence). Handle ACME-only behaviour on the MIT side instead, e.g. web/src/features/rbac/lib/upstreamRole.ts."
          printf 'Files:\n%s\n' "$touched"
          exit 1
