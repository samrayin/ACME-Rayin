name: ACME gateway hook tests

# CHG-2026-089 part b, phase 2 (security review P2-268-6). The gateway's
# guardrail hook decides whether a request decided in enforce is refused; its
# decision table is proven by stdlib unit tests that need no dependencies and
# make no network calls. This runs them on every pull request that touches
# the gateway integration.

on:
  pull_request:
    paths:
      - "integrations/litellm/**"
      - ".github/workflows/acme-litellm-hook-tests.yml"

permissions:
  contents: read

jobs:
  hook-tests:
    name: Gateway hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the gateway hook's stdlib tests
        run: python3 -m unittest discover -s integrations/litellm/tests -v
