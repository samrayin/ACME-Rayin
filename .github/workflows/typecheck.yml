# Dedicated typecheck gate, deliberately separate from the image-build /
# release pipeline (see .github/workflows/pipeline.yml and
# ACME-DEVELOPMENT-FRAMEWORK.md §3).
#
# Production images are built with NEXT_IGNORE_BUILD_ERRORS=true to avoid
# OOMing the build agent, which means the Next.js build itself does not
# typecheck the code it ships. That's how an RBAC scope rename
# (auditLogs:read -> projectAuditLogs:read) silently broke the Audit Logs
# nav item: nothing else in CI failed the build.
#
# This job runs `pnpm run typecheck` (turbo run typecheck) on its own, with
# no Next.js/Docker build attached, so it carries far lower memory pressure
# and can run safely on the default GitHub-hosted runner. It intentionally
# does not set NEXT_IGNORE_BUILD_ERRORS and does not touch
# .github/workflows/pipeline.yml.
name: Typecheck

on:
  pull_request:
    branches: ["**"]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typecheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck (turbo run typecheck)
    # Default GitHub-hosted runner on purpose: a typecheck-only job has much
    # lower memory needs than a full Next.js build, so it doesn't need the
    # larger self-hosted/Blacksmith runners used elsewhere in this repo.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
          cache: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm i

      - name: Load default env
        run: cp .env.dev.example .env

      # Deliberately no NEXT_IGNORE_BUILD_ERRORS here — that's the whole
      # point of this job. ai-gateway is excluded to match the existing
      # `pnpm run typecheck --filter=!ai-gateway` invocation used elsewhere
      # in this repo's CI.
      - name: Typecheck
        run: pnpm run typecheck --filter=!ai-gateway
