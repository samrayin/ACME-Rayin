# Example only — shows the keys LiteLLM's config expects. Never fill in real
# values here or commit real ones; create the actual Secret directly against
# the cluster (see README.md "Deployment guide" step 3).
apiVersion: v1
kind: Secret
metadata:
  name: litellm-provider-keys
  namespace: rayin-platform
type: Opaque
stringData:
  # Only provider live at first deploy, per README.md "Open decisions" #2
  # (2026-09-11: confirmed). OPENAI_API_KEY / AZURE_OPENAI_* are omitted
  # here — add them back only once those providers are actually confirmed
  # live, matching the commented-out model_list entries in
  # ../config/litellm-config.yaml.
  ANTHROPIC_API_KEY: "<real-key-not-committed>"
  # New schema/database on the existing psql-langfuse-bgqj server — not a
  # new Postgres instance. See README.md "Architecture".
  DATABASE_URL: "postgresql://<user>:<password>@psql-langfuse-bgqj.postgres.database.azure.com:5432/litellm"
  # Generate a real random value; this is LiteLLM's own proxy admin key, not
  # a provider key.
  LITELLM_MASTER_KEY: "<real-random-value-not-committed>"
  # CHG-2026-009: the bearer secret CAIRO's request-log receiver accepts. Must
  # equal CAIRO_LITELLM_INGEST_SECRET on the CAIRO web tier. At least 32
  # characters or the receiver refuses every request. It can only append
  # well-formed rows in CAIRO: it cannot read or change anything.
  CAIRO_INGEST_SECRET: "<real-random-value-not-committed>"
