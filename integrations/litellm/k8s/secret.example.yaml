# Example only — shows the keys LiteLLM's config expects. Never fill in real
# values here or commit real ones; create the actual Secret directly against
# the cluster (see README.md "Deployment guide" step 3).
apiVersion: v1
kind: Secret
metadata:
  name: litellm-provider-keys
  namespace: rayin-platform
type: Opaque
stringData:
  # Only provider live at first deploy, per README.md "Open decisions" #2
  # (2026-09-11: confirmed). OPENAI_API_KEY / AZURE_OPENAI_* are omitted
  # here — add them back only once those providers are actually confirmed
  # live, matching the commented-out model_list entries in
  # ../config/litellm-config.yaml.
  ANTHROPIC_API_KEY: "<real-key-not-committed>"
  # Provider keys the live deployment already holds but this example omitted
  # (drift found 2026-09-20 while adding the entries below).
  OPENROUTER_API_KEY: "<real-key-not-committed>"
  GROQ_API_KEY: "<real-key-not-committed>"
  # CHG-2026-015: additional judge-model options. GROQ_API_KEY already exists
  # in the live Secret; GEMINI_API_KEY does not and must be created before the
  # gemini-judge entry is applied, or that model fails at call time.
  GEMINI_API_KEY: "<real-key-not-committed>"
  # CHG-2026-086 f: the provider key for the cairo-evaluator group. It must come
  # from a different provider organisation from GROQ_API_KEY's, because the
  # provider sets its limits per organisation.
  GROQ_API_KEY_APP: "<real-key-not-committed>"
  # CHG-2026-088 b: password for the gateway's shared Redis (../k8s/redis.yaml).
  # Read by both the Redis pod and the gateway. Generate a long random value.
  REDIS_PASSWORD: "<real-random-value-not-committed>"
  # New schema/database on the existing psql-langfuse-bgqj server — not a
  # new Postgres instance. See README.md "Architecture".
  DATABASE_URL: "postgresql://<user>:<password>@psql-langfuse-bgqj.postgres.database.azure.com:5432/litellm"
  # Generate a real random value; this is LiteLLM's own proxy admin key, not
  # a provider key.
  LITELLM_MASTER_KEY: "<real-random-value-not-committed>"
