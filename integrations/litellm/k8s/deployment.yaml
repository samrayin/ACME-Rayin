# Deploys into the same AKS node Langfuse already runs on — no new node
# pool. Sizing follows the same "explicit requests/limits, don't leave it
# unbounded" reasoning applied to rayin-guardrails; see README.md
# "Architecture" for the headroom numbers this was sized against.
#
# Memory limit was originally 1Gi, sized off rayin-guardrails' spaCy
# footprint by mistake, not LiteLLM's own (Prisma client + FastAPI + bundled
# admin UI). First live deploy (2026-09-11) OOMKilled repeatedly at 1Gi —
# raised to 2Gi, still comfortably inside the node's headroom.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: rayin-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          # Pinned by digest (CHG-2026-006, 2026-09-19): this is the multi-arch
          # index digest the live pod has been running since 2026-09-12 --
          # LiteLLM 1.100.1, image built 2026-09-10, originally pulled as
          # `main-stable`. That tag floats and has since moved, so a pod
          # restart would have silently changed the gateway version. To
          # upgrade: pick a release, resolve its digest, replace it here and
          # record the change in ACME-CHANGELOG.md.
          image: ghcr.io/berriai/litellm@sha256:a3715fa7ad8387941ab697259bd2881d68931657247a41984f90fae6d11c62bf
          args: ["--config", "/app/config/litellm-config.yaml"]
          # Image's own default user is root (confirmed via `kubectl exec ... id`
          # against the live pod, 2026-09-12) -- runAsUser is required alongside
          # runAsNonRoot or the pod fails at startup. Verified safe first in an
          # ephemeral test pod (same image/args/config mount, uid 1000) before
          # applying here: app started cleanly, bound port 4000, no permission
          # errors. Flagged by the repo's Semgrep security-scan CI.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: litellm-provider-keys
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            # Managed separately, not inline here — an earlier version of
            # this file defined a placeholder ConfigMap in the same apply,
            # which silently overwrote the real one (created via the
            # --from-file command below) on every `kubectl apply -f
            # deployment.yaml`. Real source of truth stays
            # ../config/, applied with:
            #   kubectl create configmap litellm-config \
            #     --namespace rayin-platform \
            #     --from-file=litellm-config.yaml=../config/litellm-config.yaml \
            #     --from-file=cairo_guardrail_hook.py=../config/cairo_guardrail_hook.py \
            #     --dry-run=client -o yaml | kubectl apply -f -
            #
            # BOTH files, not just the YAML (CHG-2026-014 Step 1). The config's
            # `guardrails:` block names `cairo_guardrail_hook.CairoGuardrail`,
            # and litellm imports that class while PARSING the block — before,
            # and regardless of, `default_on`. A ConfigMap carrying only the
            # YAML therefore does not produce a gateway with the guardrail
            # switched off: it produces a gateway that cannot start, on the
            # next restart, whenever that happens to be. The hook file must be
            # in the ConfigMap in the same apply that introduces the block.
            name: litellm-config
