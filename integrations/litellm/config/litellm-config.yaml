# LiteLLM native config — template.
#
# Fill in the real model list for whichever providers are going live (see
# README.md "Open decisions" #2), then apply as a ConfigMap or mount directly
# — this file has no secrets in it, provider keys are referenced by env var
# name only and come from the litellm-provider-keys Secret (see
# ../k8s/secret.example.yaml).

model_list:
  # Anthropic — originally "live day one" per "Open decisions" #2
  # (2026-09-11), but the underlying account has no billing credit
  # (discovered 2026-09-12 when promptfoo's gateway eval surfaced a raw
  # "credit balance is too low" error -- every call through this model
  # 400s). Left in the model list (harmless, LiteLLM just reports it
  # unhealthy) since fixing the account's billing is the real long-term
  # answer, but nothing in this deployment should target it right now --
  # see nvidia-nemotron below, the actual live default for dev.
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # OpenRouter (NVIDIA Nemotron 3 Ultra, free tier) — added 2026-09-12 to
  # unblock promptfoo eval/red-team testing while the Anthropic account has
  # no credit (see note above). This is the model every dev-environment
  # consumer (chat, promptfoo, rayin-guardrails' own rail engine) should
  # actually target for now -- not a permanent provider decision, just what
  # works today without a billing fix. (A Groq entry was tried and removed
  # 2026-09-12: the model slug this account had access to no longer exists
  # on Groq's current lineup, and nvidia-nemotron alone was sufficient to
  # unblock testing, so it wasn't worth chasing a second working provider.)
  - model_name: nvidia-nemotron
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY

  # Groq and Gemini — added 2026-09-20 (CHG-2026-015) as ADDITIONAL judge-model
  # options, not replacements. nvidia-nemotron stays the default. Which model
  # becomes the permanent judge is week 2's decision and is gated on the
  # free-tier data-use check in ADR-0005 F3: the judge model receives the full
  # prompt text of every request the guardrail inspects, so a provider whose
  # free tier may train on submitted data is disqualified regardless of latency
  # or cost. Establish the terms before the model.
  #
  # Why these were added: on 2026-09-20 both existing judge paths were out of
  # quota at the same moment — claude-sonnet on Anthropic credit, and
  # nvidia-nemotron on OpenRouter's free tier (HTTP 429, 50 requests/day,
  # 0 remaining). One day of eval testing consumed it, because every
  # /v1/guard call costs one judge call.
  #
  # SLUGS VERIFIED 2026-09-20 against each provider's live model list, queried
  # with these accounts' own keys from a throwaway pod - i.e. what these accounts
  # can actually call, not what the docs advertise. The 2026-09-12 Groq failure is
  # explained: Groq's lineup no longer carries ANY Llama 3.x chat model, so the
  # slug used then is simply gone. Re-verify before any future apply - a dead slug
  # reports healthy in the catalogue and fails at call time.
  #
  # Pinned, not a floating alias. Gemini offers gemini-flash-latest and similar;
  # those drift exactly as a mutable image tag does, which is what CHG-2026-006
  # pinned the gateway image by digest to avoid.
  #
  # WEEK 2 INPUT, found while verifying these slugs: this Groq account can call
  # dedicated safety classifiers - meta-llama/llama-prompt-guard-2-86m and -22m
  # (Llama Prompt Guard 2, purpose-built jailbreak/prompt-injection detection)
  # and openai/gpt-oss-safeguard-20b. Those are candidates for the v5 P0 ("swap
  # the judge model to a dedicated safety classifier") and a better structural
  # fit for N-56 than any chat model, since a classifier returns a label rather
  # than free text that must be string-matched. NOT added here: they are
  # classifiers, not chat models, so whether they work through NeMo's
  # self_check_input path needs testing, not assuming.
  - model_name: groq-judge
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY

  # CHG-2026-016 — the safety model the guardrail rail is intended to use.
  # Distinct from groq-judge (a general chat model) because its purpose is
  # different: gpt-oss-safeguard-20b is trained to emit a bare safety verdict,
  # which is what NeMo's is_content_safe parser actually requires. See
  # ADR-0005 §F5: that parser takes only the FIRST TWO WORDS of the reply,
  # matches safe/unsafe/yes/no, and falls through to UNSAFE on anything else —
  # so a model that opens with preamble blocks every request. Staged and
  # untested: no call has been made through this entry.
  - model_name: groq-safeguard
    litellm_params:
      model: groq/openai/gpt-oss-safeguard-20b
      api_key: os.environ/GROQ_API_KEY

  - model_name: gemini-judge
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  # OpenAI — configured-but-dormant. Uncomment once this provider is confirmed live.
  # - model_name: gpt-4o
  #   litellm_params:
  #     model: openai/gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY

  # Azure OpenAI — configured-but-dormant. Uncomment once this provider is confirmed live.
  # - model_name: azure-gpt-4o
  #   litellm_params:
  #     model: azure/<deployment-name>
  #     api_key: os.environ/AZURE_OPENAI_API_KEY
  #     api_base: os.environ/AZURE_OPENAI_ENDPOINT
  #     api_version: "2026-01-01-preview"

general_settings:
  # LiteLLM's own state (spend tracking, virtual keys) — points at a new
  # schema/database on the existing psql-langfuse-bgqj server, not a new
  # Postgres instance. Real value comes from the DATABASE_URL key in the
  # litellm-provider-keys Secret.
  database_url: os.environ/DATABASE_URL
  master_key: os.environ/LITELLM_MASTER_KEY

# CAIRO guardrail hook (CHG-2026-014, ADR-0005 / ADR-0005-A). Step 1: the hook
# now has a verdict path -- it calls rayin-guardrails /v1/guard and acts on the
# answer. Record mode changes nothing about what the gateway returns; it writes
# down what WOULD have happened.
#
# SHIPPED INERT, ON PURPOSE. `default_on: false` means no request reaches this
# hook until a key opts in or this flag is flipped, which is ADR-0005-A layer 2's
# zero-blast-radius property. Flipping it is an owner-gated step (a ConfigMap
# change plus a gateway restart), and it MUST NOT happen before:
#
#   1. CAIRO_GUARDRAIL_SECRET exists in the litellm-provider-keys Secret. The
#      guardrails service requires it on every /v1/guard call and fails closed
#      without its own copy, so a gateway missing it gets 401s on every call.
#      It is NOT in that Secret today. The hook degrades safely (record mode
#      proceeds and logs) rather than failing requests, but it would be
#      inspecting nothing while appearing to be on.
# SETTLED 2026-09-23 (CHG-2026-038, ADR-0005 §3c addendum): CAIRO_GUARDRAIL_TIMEOUT_S
# now defaults to 2s, and the record-mode call stays synchronous. Fire-and-forget
# was rejected: it would drop the would_block signal precisely on slow responses,
# biasing low the very count record mode exists to produce. 2s rather than 1s
# because block verdicts only come from the judge path (Presidio short-circuits
# to redact before the rail runs), so the slow tail is where the signal lives --
# and p50 is 470ms with no p95 yet known. Overridable by environment, so Step 1's
# measurement can tune it without a code change.
#
# The judge key's own prerequisites ARE already met (CHG-2026-029, applied live
# 2026-09-22): opted_out_global_guardrails: ["cairo-guardrail"], a model
# allowlist, and rpm_limit 10. That is what stops the rail's judge call
# re-entering this hook in a loop (ADR-0005 F10 / Step 0).
#
# CONFIRMED 2026-09-23 on the first switch-on: litellm resolves
# `cairo_guardrail_hook.CairoGuardrail` from the ConfigMap mount at /app/config.
# That attempt was reverted because the hook read no text (CHG-2026-044). Before
# the next switch-on, run integrations/litellm/tests/in_image_check.py inside the
# gateway pod; it must PASS. Keep the restart watched and the previous ConfigMap
# to hand: a failed import stops the new pod becoming ready.
guardrails:
  - guardrail_name: "cairo-guardrail"
    litellm_params:
      guardrail: cairo_guardrail_hook.CairoGuardrail
      mode: "pre_call"
      default_on: false

# Langfuse callback registration REMOVED 2026-09-21 (CHG-2026-024).
#
# It registered success_callback/failure_callback = ["langfuse"] while this pod
# carries no LANGFUSE_* variables, so it delivered nothing and failed silently
# for its entire life. Readiness Ledger N-20, readiness audit H-26.
#
# Removed rather than enabled, deliberately. Enabling is three environment
# variables away and would write full prompt and completion text into a store
# with no reachable purge path -- retention requires an entitlement this OSS
# instance does not have (P0-11). Re-add ONLY with a named credential owner, an
# approval gate, and CHG-2026-009 turn_off_message_logging in the same change.

# Starter virtual keys — one per team/use case, per README.md "Open
# decisions" #3 (2026-09-12: $50/key, confirmed -- per-key, not a shared
# total; live-updated via /key/update from an earlier, undocumented $25/key
# drift). Created via the LiteLLM Admin UI or API after the proxy is up,
# e.g.:
#
# NOTE (2026-09-12): both starter keys are scoped to nvidia-nemotron, not
# claude-sonnet -- this dev environment's Anthropic account has no billing
# credit, so RAYIN_CHAT_LLM_MODEL and rayin-guardrails' GUARDRAILS_LLM_MODEL
# should both target nvidia-nemotron for now. Revisit once Anthropic
# billing is sorted or a real production provider decision is made --
# this is a dev-environment workaround, not the intended long-term model.
#
#   curl -X POST http://litellm.rayin-platform:4000/key/generate \
#     -H "Authorization: Bearer $LITELLM_MASTER_KEY" \
#     -H "Content-Type: application/json" \
#     -d '{"key_alias": "chat-widget", "max_budget": 50, "models": ["nvidia-nemotron"]}'
#
#   curl -X POST http://litellm.rayin-platform:4000/key/generate \
#     -H "Authorization: Bearer $LITELLM_MASTER_KEY" \
#     -H "Content-Type: application/json" \
#     -d '{"key_alias": "rayin-guardrails", "max_budget": 50, "models": ["nvidia-nemotron"]}'
